@let item = draft;
<div class="row">
  <div class="col-12 d-flex justify-content-between align-items-center">
    <h1>{{ heading }}</h1>
    <a routerLink="/my-products" class="link-secondary">My products</a>
  </div>
  <div class="col-lg-6">
    <div class="card">
      <form (ngSubmit)="submit()" autocomplete="off">
        <div class="card-body">
          <div class="mb-2">
            <label for="title" class="form-label fw-bold mb-0">Title</label>
            <input
              type="text"
              id="title"
              name="title"
              [(ngModel)]="item.title"
              class="form-control"
              maxlength="80"
              required
            />
          </div>
          <div class="mb-2">
            <label for="price" class="form-label fw-bold mb-0">Price (CAD)</label>
            <input
              type="number"
              id="price"
              name="price"
              [(ngModel)]="item.price"
              class="form-control"
              min="0.01"
              max="100000"
              step="0.01"
              required
            />
          </div>
          <div class="mb-2">
            <label for="category" class="form-label fw-bold mb-0">Category</label>
            <select
              id="category"
              name="category"
              [(ngModel)]="item.category"
              class="form-select"
              required
            >
              <option value="" disabled>Pick a category</option>
              @for (category of categories; track category.name) {
                <option [value]="category.name">{{ category.name }}</option>
              }
            </select>
          </div>
          <div class="mb-2">
            <label for="stock" class="form-label fw-bold mb-0">In stock</label>
            <input
              type="number"
              id="stock"
              name="stock"
              [(ngModel)]="item.stock"
              class="form-control"
              min="0"
              max="10000"
              step="1"
              required
            />
          </div>
          <div class="mb-2">
            <label for="brand" class="form-label fw-bold mb-0">Brand</label>
            <input
              type="text"
              id="brand"
              name="brand"
              [(ngModel)]="item.brand"
              class="form-control"
              maxlength="60"
            />
          </div>
          <div class="mb-2">
            <label for="maker" class="form-label fw-bold mb-0">Maker</label>
            <input
              type="text"
              id="maker"
              name="maker"
              [(ngModel)]="item.maker"
              class="form-control"
              maxlength="60"
            />
          </div>
          <div>
            <label for="description" class="form-label fw-bold mb-0">Description</label>
            <textarea
              id="description"
              name="description"
              [(ngModel)]="item.description"
              class="form-control"
              rows="6"
              maxlength="2000"
            ></textarea>
          </div>
        </div>
        <div class="card-footer">
          <button
            type="submit"
            class="btn btn-success col-12"
            [disabled]="saving"
            data-testid="save"
          >
            {{ submitLabel }}
          </button>
        </div>
      </form>
    </div>
  </div>
  <div class="col-lg-6 mt-3 mt-lg-0">
    <div class="card">
      <div class="card-body">
        <h2 class="h3">Photo</h2>
        @if (preview) {
          <img
            [src]="preview + '?auto=format&fit=crop&w=600&h=400&q=70'"
            class="img-fluid rounded mb-3"
            alt="Current listing"
            data-testid="photo-preview"
          />
        }
        <app-photo-uploader (uploaded)="photoUploaded($event)" />
      </div>
    </div>
  </div>
</div>
