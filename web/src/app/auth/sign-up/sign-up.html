<div class="row justify-content-center mt-4">
  <div class="col-md-6 col-lg-4">
    <div class="card">
      <div class="card-body p-4">
        <h1 class="h3 mb-3">Create account</h1>
        <form (ngSubmit)="signUp()" autocomplete="off">
          <div class="mb-3">
            <label for="userName" class="form-label fw-semibold mb-1">User name</label>
            <input
              type="text"
              class="form-control"
              id="userName"
              name="userName"
              [(ngModel)]="credentials.userName"
              autocomplete="username"
              minlength="3"
              maxlength="30"
              pattern="[A-Za-z0-9._-]+"
              required
            />
            <div class="form-text">3 to 30 letters, digits, dots, dashes or underscores.</div>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label fw-semibold mb-1">Password</label>
            <input
              type="password"
              class="form-control"
              id="password"
              name="password"
              [(ngModel)]="credentials.password"
              autocomplete="new-password"
              minlength="8"
              maxlength="128"
              required
            />
            <div class="form-text">At least 8 characters.</div>
          </div>
          <div class="mb-3">
            <label for="confirmation" class="form-label fw-semibold mb-1">Re-enter password</label>
            <input
              type="password"
              class="form-control"
              id="confirmation"
              name="confirmation"
              [(ngModel)]="confirmation"
              autocomplete="new-password"
              required
            />
          </div>
          <button
            type="submit"
            class="btn btn-warning w-100"
            [disabled]="busy()"
            data-testid="sign-up"
          >
            Create your account
          </button>
        </form>
      </div>
    </div>
    <div class="text-center mt-3 small">
      <span class="text-secondary me-1">Already have an account?</span>
      <a
        routerLink="/sign-in"
        [queryParams]="returnUrl() ? { returnUrl: returnUrl() } : {}"
        data-testid="sign-in-link"
        >Sign in</a
      >
    </div>
  </div>
</div>
