<div class="row justify-content-center mt-4">
  <div class="col-md-6 col-lg-4">
    <div class="card">
      <div class="card-body p-4">
        <h1 class="h3 mb-3">Sign in</h1>
        <form (ngSubmit)="signIn()" autocomplete="off">
          <div class="mb-3">
            <label for="userName" class="form-label fw-semibold mb-1">User name</label>
            <input
              type="text"
              class="form-control"
              id="userName"
              name="userName"
              [(ngModel)]="credentials.userName"
              autocomplete="username"
              required
            />
          </div>
          <div class="mb-3">
            <label for="password" class="form-label fw-semibold mb-1">Password</label>
            <input
              type="password"
              class="form-control"
              id="password"
              name="password"
              [(ngModel)]="credentials.password"
              autocomplete="current-password"
              required
            />
          </div>
          <button
            type="submit"
            class="btn btn-warning w-100"
            [disabled]="busy()"
            data-testid="sign-in"
          >
            Sign in
          </button>
        </form>
      </div>
    </div>
    <div class="text-center mt-3 small">
      <span class="text-secondary me-1">New to HOME MARKET?</span>
      <a
        routerLink="/sign-up"
        [queryParams]="returnUrl() ? { returnUrl: returnUrl() } : {}"
        data-testid="sign-up-link"
        >Create your account</a
      >
    </div>
  </div>
</div>
