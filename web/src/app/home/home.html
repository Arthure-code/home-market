<div class="mt-5">
  <div class="text-center mb-5">
    <h1>Shop everyday things</h1>
    <p class="lead">
      Find and sell what a home needs. Browse freely, sign up to buy, like and sell.
    </p>
    @if (!signedIn()) {
      <a routerLink="/sign-up" class="btn btn-primary btn-lg me-2" data-testid="sign-up">Sign up</a>
    }
    <a routerLink="/products" class="btn btn-info btn-lg">See the catalogue</a>
  </div>
  <app-product-list />
</div>
