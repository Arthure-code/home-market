<button
  type="button"
  class="drop-zone d-block w-100"
  (dragover)="onDragOver($event)"
  (drop)="onDrop($event)"
  (click)="fileInput.click()"
>
  Drag and drop your photo here, or click to choose one
</button>
<label for="photo-file" class="visually-hidden">Photo file</label>
<input
  type="file"
  id="photo-file"
  #fileInput
  class="d-none"
  (change)="onFileSelected($event)"
  accept="image/*"
/>
@if (file; as chosen) {
  <div class="p-3">
    <span data-testid="file-name">{{ chosen.name }}</span>
  </div>
  <div>
    <button
      type="button"
      class="btn btn-warning me-1"
      (click)="upload()"
      [disabled]="busy"
      data-testid="upload"
    >
      Upload
    </button>
    <button type="button" class="btn btn-danger" (click)="clear()" [disabled]="busy">Cancel</button>
  </div>
}
