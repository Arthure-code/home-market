@let item = draft();
<div class="row">
  <div class="col-12 d-flex justify-content-between align-items-center">
    <h1>New message</h1>
    <a routerLink="/messages" class="link-secondary">Messages</a>
  </div>
  <div class="col-lg-8">
    <div class="card">
      <form (ngSubmit)="send()" autocomplete="off">
        <div class="card-body">
          <div class="mb-2">
            <label for="to" class="form-label fw-bold mb-0">To</label>
            <input
              type="text"
              id="to"
              name="to"
              [(ngModel)]="item.to"
              class="form-control"
              placeholder="User name of the member"
              maxlength="30"
              required
            />
          </div>
          <div class="mb-2">
            <label for="subject" class="form-label fw-bold mb-0">Subject</label>
            <input
              type="text"
              id="subject"
              name="subject"
              [(ngModel)]="item.subject"
              class="form-control"
              maxlength="120"
              required
            />
          </div>
          <div class="mb-2">
            <label for="body" class="form-label fw-bold mb-0">Message</label>
            <textarea
              id="body"
              name="body"
              [(ngModel)]="item.body"
              class="form-control"
              rows="6"
              maxlength="4000"
              required
            ></textarea>
          </div>
        </div>
        <div class="card-footer">
          <button type="submit" class="btn btn-success" [disabled]="sending()" data-testid="send">
            <i class="fa fa-paper-plane" aria-hidden="true"></i> Send
          </button>
          <a routerLink="/messages" class="btn btn-link">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
