<p class="mb-3">
  <a routerLink="/messages" class="link-secondary">&larr; Messages</a>
</p>

@if (message; as item) {
  <div class="row">
    <div class="col-lg-8">
      <div class="card">
        <div class="card-header">
          <h1 class="h4 card-title mb-2">{{ item.subject }}</h1>
          <p class="card-subtitle text-secondary small mb-0" data-testid="parties">
            From {{ item.from }} to {{ item.to }}, {{ item.sentAt | date: 'MMM d, y, h:mm a' }}
          </p>
        </div>
        <div class="card-body">
          <p class="card-text body" data-testid="body">{{ item.body }}</p>
        </div>
        @if (!item.mine) {
          <div class="card-footer">
            <a
              [routerLink]="['/messages/new', item.from]"
              [queryParams]="{ subject: 'Re: ' + item.subject }"
              class="btn btn-primary"
              data-testid="reply"
              ><i class="fa fa-reply" aria-hidden="true"></i> Reply</a
            >
          </div>
        }
      </div>
    </div>
  </div>
} @else {
  <output class="text-secondary">Loading...</output>
}
