name: Build
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
      - name: Install the SonarScanner for .NET
        run: dotnet tool install --global dotnet-sonarscanner
      - name: Test the web app with coverage
        working-directory: web
        run: |
          npm ci --ignore-scripts
          npm run lint
          npm run coverage
          sed -i 's|^SF:|SF:web/|' coverage/web/lcov.info
      - name: Begin the analysis
        run: >
          dotnet sonarscanner begin
          /k:"Arthure-code_home-market"
          /o:"arthuredevsecops"
          /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.projectBaseDir="${{ github.workspace }}"
          /d:sonar.cs.opencover.reportsPaths="api/**/coverage.opencover.xml"
          /d:sonar.javascript.lcov.reportPaths="web/coverage/web/lcov.info"
          /d:sonar.exclusions="web/node_modules/**,web/dist/**,web/.angular/**,web/coverage/**,web/public/**,api/src/HomeMarket.Api/Migrations/**"
          /d:sonar.test.inclusions="**/*.spec.ts"
          /d:sonar.coverage.exclusions="web/eslint.config.js,web/src/main.ts,web/src/app/app.config.ts,web/src/app/app.routes.ts,api/src/HomeMarket.Api/Program.cs,api/src/HomeMarket.Api/Data/Catalogue.cs,api/src/HomeMarket.Api/Migrations/**"
      - name: Build and test the API with coverage
        run: |
          dotnet build api/HomeMarket.sln --no-incremental
          dotnet test api/HomeMarket.sln --no-build --collect:"XPlat Code Coverage" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
      - name: End the analysis
        run: dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
